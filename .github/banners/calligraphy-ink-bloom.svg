<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="cib-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfaf2"/>
      <stop offset="50%" stop-color="#f5ecd6"/>
      <stop offset="100%" stop-color="#e8d9b5"/>
    </linearGradient>
    <radialGradient id="cib-ink-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a1a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#1a1a3a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2a2a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cib-ink-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a4a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a1a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cib-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cib-nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#737373"/>
    </linearGradient>
    <pattern id="cib-paper-grain" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3"  cy="5"  r="0.4" fill="#d4c5a0" opacity="0.3"/>
      <circle cx="14" cy="12" r="0.3" fill="#d4c5a0" opacity="0.25"/>
      <circle cx="8"  cy="17" r="0.4" fill="#d4c5a0" opacity="0.3"/>
    </pattern>
    <filter id="cib-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- Washi paper background -->
  <rect width="800" height="120" fill="url(#cib-paper)"/>
  <rect width="800" height="120" fill="url(#cib-paper-grain)"/>

  <!-- Subtle paper edge shadow -->
  <rect x="0" y="0"   width="800" height="3" fill="#0a0a1a" opacity="0.1"/>
  <rect x="0" y="117" width="800" height="3" fill="#0a0a1a" opacity="0.1"/>

  <!-- Ink drop blooms spreading out — multiple expanding circles -->
  <g>
    <!-- Big central bloom -->
    <circle cx="120" cy="60" r="0" fill="url(#cib-ink-1)">
      <animate attributeName="r" values="0;28;28;30;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0.6;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="60" r="0" fill="url(#cib-ink-2)">
      <animate attributeName="r" values="0;38;42;0" dur="6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.3;0" dur="6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Secondary blooms — right side -->
    <circle cx="680" cy="65" r="0" fill="url(#cib-ink-1)">
      <animate attributeName="r" values="0;22;22;26;0" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0.4;0" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="65" r="0" fill="url(#cib-ink-2)">
      <animate attributeName="r" values="0;32;36;0" dur="7s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.2;0" dur="7s" begin="1.9s" repeatCount="indefinite"/>
    </circle>

    <!-- Small ink splatters -->
    <circle cx="200" cy="40" r="2" fill="#0a0a1a" opacity="0.7" filter="url(#cib-soft)">
      <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="78" r="1.5" fill="#0a0a1a" opacity="0.6" filter="url(#cib-soft)">
      <animate attributeName="opacity" values="0;0.6;0" dur="4.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="42" r="2" fill="#0a0a1a" opacity="0.7" filter="url(#cib-soft)">
      <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="555" cy="82" r="1.7" fill="#0a0a1a" opacity="0.6" filter="url(#cib-soft)">
      <animate attributeName="opacity" values="0;0.6;0" dur="4.2s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Calligraphic brush stroke flourishes — emerging from the blooms -->
  <g stroke="#0a0a1a" fill="none" stroke-linecap="round" filter="url(#cib-soft)">
    <!-- Left flourish — flowing curl extending right -->
    <path d="M 130,60 Q 180,40 230,55 Q 260,70 290,52" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0.85;0" dur="6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="6s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 150,72 Q 200,90 250,80" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,150;150,0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- Right flourish — mirror direction -->
    <path d="M 670,65 Q 620,42 570,58 Q 540,72 510,50" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0.85;0" dur="7s" begin="2.3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="7s" begin="2.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 650,75 Q 600,93 550,82" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="7s" begin="2.7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,150;150,0" dur="7s" begin="2.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Gold leaf accent dots -->
  <g>
    <circle cx="60"  cy="30"  r="2" fill="url(#cib-gold)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="30"  r="2" fill="url(#cib-gold)">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60"  cy="92"  r="2" fill="url(#cib-gold)">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="92"  r="2" fill="url(#cib-gold)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Fountain pen nib (top-left, dropping ink) -->
  <g transform="translate(95,18)">
    <!-- Pen body -->
    <rect x="-2" y="-12" width="8" height="20" fill="#1f2937" rx="1"/>
    <!-- Nib -->
    <polygon points="-2,8 6,8 4,22 0,22" fill="url(#cib-nib)"/>
    <!-- Nib slit -->
    <line x1="2" y1="10" x2="2" y2="22" stroke="#0a0a1a" stroke-width="0.5"/>
    <!-- Ink drop falling -->
    <ellipse cx="2" cy="28" rx="1.5" ry="2" fill="#0a0a1a">
      <animate attributeName="cy" values="22;36;36" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Signature underline (drawn left-to-right) -->
  <path d="M 240,90 Q 320,95 400,90 Q 480,87 560,92" stroke="#0a0a1a" fill="none" stroke-width="1.5"
        stroke-linecap="round" opacity="0.55"
        stroke-dasharray="350" stroke-dashoffset="350">
    <animate attributeName="stroke-dashoffset" values="350;0" dur="2s" begin="1.2s" fill="freeze"/>
  </path>

  <!-- Soft cream halo behind text for readability -->
  <rect x="180" y="32" width="440" height="58" rx="6" fill="#fdfaf2" opacity="0.65"/>

  <!-- Author name -->
  <text x="400" y="56" font-family="'Segoe UI',sans-serif" font-size="27" font-weight="700"
        fill="#0a0a1a" text-anchor="middle" letter-spacing="3">
    Masrik Dahir<animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>
  <text x="400" y="80" font-family="'Segoe UI',sans-serif" font-size="13"
        fill="#a16207" text-anchor="middle" letter-spacing="2">
    ✦ masrikdahir.com ✦<animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.8s" fill="freeze"/>
  </text>
</svg>
