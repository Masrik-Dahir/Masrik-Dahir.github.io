    <style>
        /* ════════════════════════════════════════════════════════
           MAP-PAGE styling rules
           ────────────────────────────────────────────────────────
           • .w3-card  → keeps the polish.css hex-pattern hover, but
                          its mask is overridden with a travel-icon
                          tessellation. This is where the actual SVG
                          map graphics live.
           • Every other liquid-glass element (region buttons, header
                          buttons, etc.) → DISABLES the travel-icon
                          mask layer and instead gets a software-card-
                          style side-colour glow on hover (colored
                          corner glow + perimeter rim + outer halo). */

        /* Travel-icon mask — only applies to .w3-card. The JS at
           the bottom of body sets --lg-hex-mask on .w3-card elements
           on hover. For everything else, we'll disable the pseudo-
           element mask layer entirely. */
        body.polish {
            --lg-hex-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='%23000'><path transform='translate(15 18)' d='M14 0 L18 0 L18 8 L28 12 L28 14 L18 12 L18 22 L22 26 L22 28 L10 28 L10 26 L14 22 L14 12 L4 14 L4 12 L14 8 L14 0 Z' fill-opacity='0.88'/><path transform='translate(135 25)' d='M0 4 L18 4 L18 18 L0 18 Z M6 0 L12 0 L12 4 L6 4 Z' fill-opacity='0.80'/><path transform='translate(20 95)' d='M0 12 L24 12 L21 16 L3 16 Z M11 0 L13 0 L13 12 L11 12 Z' fill-opacity='0.85'/><path transform='translate(110 90)' d='M12 0 L14 12 L12 24 L10 12 Z M0 12 L12 10 L24 12 L12 14 Z' fill-opacity='0.72'/><path transform='translate(70 140)' d='M8 0 C12 0,14 4,14 8 C14 12,11 14,8 14 C5 14,2 12,2 8 C2 4,4 0,8 0 Z M6 14 L10 14 L10 18 L6 18 Z' fill-opacity='0.78'/><path transform='translate(140 145)' d='M12 0 L14 2 L14 20 L18 20 L16 22 L12 22 L8 22 L6 20 L10 20 L10 2 Z M4 8 L20 8 L20 10 L4 10 Z' fill-opacity='0.82'/></g></svg>");
            --lg-facet-big: 200px;
        }

        /* Faint cyan tint on .w3-card so the surface reads as
           SEA/SKY rather than just empty white. */
        body.polish .w3-card,
        body.polish .w3-card-2,
        body.polish .w3-card-4 {
            background-image:
                radial-gradient(ellipse 70% 50% at 20% 30%, rgba(180,220,235,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 60% 70% at 75% 80%, rgba(160,210,225,0.05) 0%, transparent 65%);
        }

        /* AT-REST FILL is handled by js/map-enhancer.js — it reads
           image.json (visit counts per region) and applies the visited
           teal / unvisited grey colours via setPathFill. We do NOT
           force a fill here; doing so would override map-enhancer's
           per-region colouring. */

        /* Hover-flag images: best-quality scaling for big states/countries.
           map-enhancer.js generates <pattern> → <image> for each region;
           when a continent-scale path uses that pattern as fill, the
           image gets blown up to huge physical sizes. These hints ask
           every browser engine for its highest-quality resampling. */
        body.polish .w3-card svg pattern image,
        body.polish .w3-card svg > image {
            image-rendering: auto;
            image-rendering: smooth;
            image-rendering: high-quality;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimizeQuality;
        }

        /* STATE/COUNTRY BORDERS — slim, visible, AUTO-SIZED per map.
           Different SVG maps have different viewBox dimensions and
           render at different display sizes, so a fixed stroke-width
           looks too thick on some maps and too thin on others.

           Strategy:
             • `vector-effect: non-scaling-stroke` keeps the stroke a
               constant device-pixel width regardless of how the SVG
               is zoomed (handles user zoom uniformity).
             • `--map-stroke` is a CSS variable set per-SVG by the
               auto-tuning JS at the bottom of <body>. The JS measures
               each map's rendered size + path complexity and picks a
               proportional width (range 0.5 – 1.2 px).
             • A sensible default of 0.8 fires if JS hasn't run yet. */
        body.polish .w3-card svg path[data-id],
        body.polish .w3-card svg path[id] {
            stroke: rgba(20, 30, 50, 0.75) !important;
            stroke-width: var(--map-stroke, 0.8) !important;
            stroke-linejoin: round !important;
            stroke-linecap: round !important;
            vector-effect: non-scaling-stroke !important;
            paint-order: stroke fill;
            transition: stroke 0.2s ease, stroke-width 0.2s ease, filter 0.2s ease;
        }
        body.polish .w3-card svg path[data-id]:hover,
        body.polish .w3-card svg path[id]:hover {
            stroke: rgba(10, 14, 28, 1.00) !important;
            stroke-width: var(--map-stroke-hover, 1.5) !important;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.30));
        }

        /* ── SOFTWARE-CARD LIQUID GLASS for region buttons ────────
           Full multi-layer treatment matching the software.html cards:
             • Coloured border (visible at rest, saturates on hover)
             • Outer directional halo (up-and-left, with bounced halo
               down-and-right) via box-shadow
             • Inner corner glow at top-left (::before, blurred,
               soft-light blended)
             • Perimeter rim catch-lights + bottom-right counter
               reflection (::after, inset box-shadows + radial)
           The polish.css travel-icon mask is explicitly disabled on
           these buttons so its <mask-image: var(--lg-hex-mask)> is
           overridden by the software-card pseudo-element rendering. */

        /* ── DIAMOND HEXAGON LIQUID GLASS norm — applied to every
              country/state selector button on map.html. Replaces the
              prior software-card corner-glow style. Same model used
              by work.html, software.html, academia.html, games.html:
              hex outline mesh + rotating conic-rainbow border +
              sweeping glint. Per-button colour theme still cycles
              through 6 hues via nth-child below — that colour drives
              the halo + active variant. */
        @property --rcn-edge-angle {
            syntax: '<angle>'; initial-value: 0deg; inherits: false;
        }
        @property --rcn-glint-pos {
            syntax: '<percentage>'; initial-value: -25%; inherits: false;
        }
        @keyframes tt-rcn-edge-spin  { to { --rcn-edge-angle: 360deg; } }
        @keyframes tt-rcn-glint      { 0% { --rcn-glint-pos: -25%; } 100% { --rcn-glint-pos: 125%; } }
        @keyframes tt-hex-sweep      { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }
        @keyframes tt-hex-hue-cycle  {
            from { filter: saturate(1.25) brightness(1.05) hue-rotate(  0deg); }
            to   { filter: saturate(1.25) brightness(1.05) hue-rotate(360deg); }
        }

        body.polish .pop-up-button {
            --c-r:  99; --c-g: 102; --c-b: 241;
            --hex-size: 6px;
            --rcn-edge-angle: 0deg;
            --rcn-glint-pos: -25%;
            position: relative !important;
            isolation: isolate !important;
            overflow: hidden !important;
            border-radius: 12px !important;
            background:
                linear-gradient(135deg,
                    rgba(255,255,255,0.94) 0%,
                    rgba(248,250,255,0.90) 100%) padding-box,
                conic-gradient(from var(--rcn-edge-angle),
                    rgba(255,179,198,0.55),
                    rgba(255,209,168,0.55),
                    rgba(255,240,168,0.55),
                    rgba(196,242,197,0.55),
                    rgba(184,217,255,0.55),
                    rgba(212,193,255,0.55),
                    rgba(255,193,229,0.55),
                    rgba(255,179,198,0.55)
                ) border-box !important;
            border: 1.5px solid transparent !important;
            backdrop-filter: blur(6px) saturate(120%) !important;
            -webkit-backdrop-filter: blur(6px) saturate(120%) !important;
            /* DRASTICALLY reduced shadow — just a 1-pixel inner top
               highlight + a hairline 1-pixel elevation. No outer
               coloured halo at rest. */
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.85),
                0 1px 2px rgba(15,20,40,0.08) !important;
            transition: transform 0.18s ease, box-shadow 0.22s ease !important;
            animation:
                tt-rcn-edge-spin 4.5s linear infinite,
                tt-rcn-glint     6.0s linear infinite !important;
        }

        /* Hex mesh on ::before — hidden at rest, fades + animates on hover. */
        body.polish .pop-up-button::before {
            content: '' !important;
            position: absolute !important;
            inset: 0 !important;
            z-index: -1 !important;
            pointer-events: none !important;
            border-radius: inherit !important;
            display: block !important;
            width: auto !important;
            height: auto !important;
            top: 0 !important;
            left: 0 !important;
            filter: none !important;
            background: linear-gradient(90deg,
                #ffb3c6 0%, #ffd1a8 14%, #fff0a8 28%, #c4f2c5 42%,
                #b8d9ff 56%, #d4c1ff 70%, #ffc1e5 85%, #ffb3c6 100%) !important;
            background-size: 300% 100% !important;
            background-position: 0% 50% !important;
            -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 32'><polygon points='14,1.5 26,8 26,24 14,30.5 2,24 2,8' fill='none' stroke='%23000' stroke-width='3.5'/></svg>") !important;
                    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 32'><polygon points='14,1.5 26,8 26,24 14,30.5 2,24 2,8' fill='none' stroke='%23000' stroke-width='3.5'/></svg>") !important;
            -webkit-mask-size: var(--hex-size) calc(var(--hex-size) * 1.14) !important;
                    mask-size: var(--hex-size) calc(var(--hex-size) * 1.14) !important;
            -webkit-mask-repeat: repeat !important;
                    mask-repeat: repeat !important;
            mix-blend-mode: normal !important;
            opacity: 0 !important;
            animation: none !important;
            transition: opacity 0.30s ease !important;
        }
        /* Suppress the old ::after rim/counter-glow layer */
        body.polish .pop-up-button::after {
            content: none !important;
            display: none !important;
        }

        /* Keep the button's img / text content above the hex layer */
        body.polish .pop-up-button > * {
            position: relative;
            z-index: 3;
        }

        /* Hover hex shimmer — subtle pastel hex outlines cycling.
           Same as before but the WRAPPER's border becomes clearly
           visible (themed solid colour) and shadow is killed. */
        body.polish .pop-up-button:hover::before {
            opacity: 0.30 !important;
            animation:
                tt-hex-sweep      3.0s linear infinite,
                tt-hex-hue-cycle  4.5s linear infinite !important;
            filter: saturate(0.55) brightness(1.02);
        }
        /* On hover the conic-gradient border is REPLACED with a flat
           themed solid border so the edge reads as a clear line.
           Shadow is also stripped down to just the inner highlight
           and a 1-px elevation — no glowing halo. */
        body.polish .pop-up-button:hover {
            transform: translateY(-1px) !important;
            background:
                linear-gradient(135deg,
                    rgba(255,255,255,0.97) 0%,
                    rgba(248,250,255,0.93) 100%) padding-box,
                linear-gradient(135deg,
                    rgba(var(--c-r), var(--c-g), var(--c-b), 0.85),
                    rgba(var(--c-r), var(--c-g), var(--c-b), 0.85)
                ) border-box !important;
            border: 1.5px solid transparent !important;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.90),
                0 1px 2px rgba(15,20,40,0.10) !important;
        }

        /* Per-button colour rotation — cycles through six travel-
           themed hues so each region selector reads as its own
           identity rather than every button being indigo. */
        body.polish .pop-up-button:nth-child(6n+1) { --c-r:  99; --c-g:102; --c-b:241; --c-r2:129; --c-g2:140; --c-b2:248; } /* indigo */
        body.polish .pop-up-button:nth-child(6n+2) { --c-r:  16; --c-g:185; --c-b:129; --c-r2: 52; --c-g2:211; --c-b2:153; } /* emerald */
        body.polish .pop-up-button:nth-child(6n+3) { --c-r: 245; --c-g:158; --c-b: 11; --c-r2:251; --c-g2:191; --c-b2: 36; } /* amber */
        body.polish .pop-up-button:nth-child(6n+4) { --c-r: 236; --c-g: 72; --c-b:153; --c-r2:244; --c-g2:114; --c-b2:182; } /* pink */
        body.polish .pop-up-button:nth-child(6n+5) { --c-r:   6; --c-g:182; --c-b:212; --c-r2: 34; --c-g2:211; --c-b2:238; } /* cyan */
        body.polish .pop-up-button:nth-child(6n+6) { --c-r: 139; --c-g: 92; --c-b:246; --c-r2:167; --c-g2:139; --c-b2:250; } /* violet */

        /* ── DESKTOP: clear the fixed .lang-bar ───────────────────
           The second top nav (.lang-bar with continent buttons) is
           position:fixed at top:var(--nav-h) and stands --lang-bar-h
           (76 px) tall. components.js's <br><br><br> spacer only
           clears the main topnav (~68 px), so without extra offset
           the .lang-bar overlays — and visually cuts off — the
           search bar / country tiles that follow.

           Push the main content down by --lang-bar-h on desktop
           only; on mobile (≤1026px) the .lang-bar is hidden via
           .resizing-1026-more, so the components.js mobile nav
           placeholder (`margin-bottom: 70px`) already gives the
           same gap every other page uses between the top nav and
           the first content row — leave it alone. */
        @media only screen and (min-width: 1027px) {
            body.polish > div.w3-content {
                padding-top: var(--lang-bar-h);
            }
        }
        /* MOBILE: the inline `padding: 90px 1px 1px` on .w3-content was
           sized to clear the fixed .lang-bar on desktop. On mobile the
           lang-bar is hidden, so 90px of top padding stacks on top of
           the components.js mobile nav's 70px margin-bottom and pushes
           the search bar far below where the first content row sits on
           every other page. Trim to 16px (matching w3-margin-top used
           site-wide) so the gap between topnav and search bar matches
           the rest of the site. */
        @media only screen and (max-width: 1026px) {
            body.polish > div.w3-content {
                padding-top: 16px !important;
            }
        }

        /* ── Mobile: show only the first 5 country tiles UNDER THE SEARCH BAR.
           Scoped to .top-tile-strip ONLY — the per-SVG state/province/country
           tile-strips inside the regional .w3-card sections render every
           item as before. Underlying page logic (pageSize 10) is untouched. */
        /* Tile-strip visible cap: 10 desktop, 5 mobile. Pager logic unchanged. */
        .top-tile-strip > div:nth-child(n+11) { display: none !important; }
        @media only screen and (max-width: 1026px) {
            .top-tile-strip > div:nth-child(n+6) { display: none !important; }
        }

        /* ── PERF: defer rendering of inline country / region SVG maps ─────
           The page contains 23 large inline SVG sections — without help,
           the browser pays the full layout cost of every one on first paint
           even though pagination ends up hiding most. Three complementary
           tricks:

           1. Pre-hide every .w3-card direct child of the content container
              by default (display:none gate). Vue removes the gate (adds
              body.map-ready) once it has mounted and called
              syncContentSectionsToPage — until then, nothing below the
              search bar renders at all, so first paint is essentially the
              cost of the navbar + tile strip + pager.

           2. .section-collapsed — applied to sections not on the active
              page. Uses content-visibility:hidden + height:0 so the
              browser SKIPS rendering the content (no paint, no layout
              for the SVG inside) but preserves the rendered state for
              the next reveal. Switching a section in/out of this class
              is dramatically faster than display:none/'', because
              display:'' forces the browser to relayout + repaint the
              SVG from scratch each time.

           3. content-visibility: auto on the sections that ARE visible.
              The browser then skips layout/paint for any section currently
              scrolled off-screen and resumes it only when the user scrolls
              near it. contain-intrinsic-size reserves approximate space so
              the scrollbar doesn't jump as sections render in.
        */
        .w3-container.w3-margin-top > .w3-card {
            content-visibility: auto;
            contain-intrinsic-size: 1px 800px;
        }
        .w3-container.w3-margin-top > .w3-card.section-collapsed,
        .w3-container.w3-margin-top > hr.section-collapsed {
            content-visibility: hidden !important;
            height: 0 !important;
            min-height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            border: 0 !important;
            overflow: hidden !important;
            visibility: hidden !important;
            contain: strict !important;
            pointer-events: none !important;
        }
        body:not(.map-ready) .w3-container.w3-margin-top > .w3-card,
        body:not(.map-ready) .w3-container.w3-margin-top > hr {
            display: none !important;
        }
    </style>

            /* Force FontAwesome 5 SOLID weight on the cross icon so the X
               glyph renders. `<i class="fa fa-times">` is FA4-style;

            .search-cross-btn i.fa.fa-times,

                font-weight: 900 !important;
                font-style: normal !important;
            }

        'M0 -10 C5 -10,10 -5,10 0 C10 5,5 10,0 10 C-5 10,-10 5,-10 0 C-10 -5,-5 -10,0 -10 Z M0 -7 C-4 -7,-7 -4,-7 0 C-7 4,-4 7,0 7 C4 7,7 4,7 0 C7 -4,4 -7,0 -7 Z M-10 -2 L-7 -2 L-7 2 L-10 2 Z M7 -2 L10 -2 L10 2 L7 2 Z',
        /* SNOWFLAKE — 6 arms */
        'M0 -12 L1 -12 L1 12 L-1 12 L-1 -12 Z M-10 -6 L10 6 L9 7 L-11 -5 Z M-10 6 L10 -6 L11 -5 L-9 7 Z',
        /* KEY — round bow + shaft + teeth */
        'M-10 0 C-10 -4,-6 -6,-3 -4 L8 -4 L8 -2 L4 -2 L4 0 L0 0 L0 2 L-3 2 C-6 4,-10 4,-10 0 Z'
    ];

    /* Place one icon at (cx, cy) with random scale + rotation +
       opacity. Returns the SVG <path> markup with a baked-in
       transform string. Uses SINGLE quotes for SVG attributes so
       the outer CSS `url("…")` (double-quoted) parses cleanly — a
       single inner double-quote would terminate the URL early. */
    function placeIcon(cx, cy){
        var d = ICONS[Math.floor(Math.random() * ICONS.length)];
        var scale = R(0.55, 1.10);
        var rot   = pickInt(-30, 30);  /* tilt within ±30° */
        var alpha = R(0.65, 0.92);
        return "<path d='" + d + "' fill='%23000' fill-opacity='" +
               alpha.toFixed(2) + "' transform='translate(" +
               cx.toFixed(1) + " " + cy.toFixed(1) + ") rotate(" +
               rot + ") scale(" + scale.toFixed(2) + ")'/>";
    }

    /* Build the tile: a Poisson-ish scatter — divide the tile into
       a 4×4 jittered grid so icons spread out evenly without
       overlapping, with random per-cell offset for organic feel. */
    function buildTile(){
        var paths = '';
        var cellsX = 4, cellsY = 4;
        var cellW = TILE / cellsX;
        var cellH = TILE / cellsY;
        for (var x = 0; x < cellsX; x++){
            for (var y = 0; y < cellsY; y++){
                if (Math.random() < 0.10) continue;
                var cx = cellW * (x + R(0.22, 0.78));
                var cy = cellH * (y + R(0.22, 0.78));
                paths += placeIcon(cx, cy);
            }
        }
        return paths;
    }

    /* Build one complete mask data-URL string */
    function buildMaskUrl(){
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " +
                  TILE + " " + TILE + "'>" + buildTile() + "</svg>";
        return "url(\"data:image/svg+xml;utf8," + svg + "\")";
    }

    /* Initial GLOBAL mask — covers the first paint and any element
       the user hasn't hovered yet. Set on body.polish so every
       liquid-glass surface reads it via CSS cascade. */
    var style = document.createElement('style');
    style.id = 'lg-map-random';
    style.textContent =
        "body.polish {" +
            "--lg-hex-mask: " + buildMaskUrl() + ";" +
            "--lg-facet-big: " + TILE + "px;" +
        "}";
    document.head.appendChild(style);

    /* ─── Per-hover re-randomization ───────────────────────────
       Every time the cursor enters a liquid-glass element, that
       element gets its OWN freshly-generated mask via an inline
       custom-property override. The element-scoped value beats
       the body-level one through the cascade, so each card
       shuffles independently — hover the same card twice and the
       icon arrangement is different each time. */
    /* Every liquid-glass surface (cards AND buttons) gets a fresh
       travel-icon mask on each mouseenter, so the unique shapes
       appear on hover and change every time. */
    var TARGET_SEL = '.w3-card, .w3-card-2, .w3-card-4, .pop-up-button, ' +
                     'button:not(.glow-on-hover-nav):not(.glow-on-hover3)' +
                     ':not(.glow-on-hover12):not(.tt-chip):not(.tt-toggle)' +
                     ':not(.ww-icon-btn):not(.msl-core):not(.dfn-core)' +
                     ':not(.city-switch-btn)';

    function attach(el){
        if (el._lgRandomized) return;
        el._lgRandomized = true;
        el.addEventListener('mouseenter', function(){
            el.style.setProperty('--lg-hex-mask', buildMaskUrl());
        });
    }
    function scanAndAttach(){
        var nodes = document.querySelectorAll(TARGET_SEL);
        for (var i = 0; i < nodes.length; i++) attach(nodes[i]);
    }

    /* Run on page load + after every DOM change (Vue cards mount
       asynchronously, so the initial scan misses them). */
    if (document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', scanAndAttach);
    } else {
        scanAndAttach();
    }
    /* Catch buttons/cards added later (Vue v-for renders). */
    if (typeof MutationObserver !== 'undefined'){
        var obs = new MutationObserver(scanAndAttach);
        obs.observe(document.body, { childList: true, subtree: true });
    }

    /* ─── Auto-tune state/country border thickness per SVG ────────
       A fixed stroke-width looks wrong across maps with wildly
       different viewBox dimensions and rendered sizes. This routine
       picks a per-SVG `--map-stroke` from three signals:

         1. Rendered width (px on screen) — bigger maps tolerate a
            slightly thicker stroke; small maps need finer lines.
         2. viewBox extent — maps with tiny coordinate spaces (e.g.
            country outlines at 0–100) need thinner numeric values
            to translate to the same screen thickness.
         3. Average path bounding-box — maps with lots of tiny
            sub-regions (Indonesia islands, Greek isles) get thinner
            strokes so the small shapes stay readable.

       Output stroke is clamped to [0.45, 1.20] so it never goes
       invisible or chunky. Hover stroke is 1.7× the rest stroke. */
    function tuneMapStrokes(){
        document.querySelectorAll('.w3-card svg').forEach(function(svg){
            var rect = svg.getBoundingClientRect();
            if (rect.width < 10 || rect.height < 10) return;

            /* viewBox dimensions */
            var vb = svg.viewBox && svg.viewBox.baseVal;
            var vbW = (vb && vb.width)  ? vb.width  : rect.width;
            var vbH = (vb && vb.height) ? vb.height : rect.height;

            /* Average bounding-box width of the regions, as a proxy
               for "how big is one typical state/country in this map".
               Small average → many small regions → use a thinner stroke. */
            var paths = svg.querySelectorAll('path[data-id], path[id]');
            var sumDim = 0, count = 0;
            for (var i = 0; i < paths.length; i++){
                try {
                    var b = paths[i].getBBox();
                    if (b.width > 0 && b.height > 0){
                        sumDim += (b.width + b.height) / 2;
                        count++;
                    }
                } catch(e){ /* getBBox can throw on hidden elements */ }
            }
            var avgDim = count ? (sumDim / count) : Math.min(vbW, vbH) * 0.2;

            /* avgDim is in SVG user units. Convert to device pixels
               using the SVG's render scale: devicePxPerUnit = rect.width / vbW */
            var pxPerUnit = rect.width / vbW;
            var avgPx = avgDim * pxPerUnit;  /* avg region size on screen */

            /* Heuristic: stroke ≈ 0.55 + log2(avgPx / 40) * 0.18
               – avgPx ~40 px → stroke 0.55 (tiny details)
               – avgPx ~80 px → stroke 0.73
               – avgPx ~160 px → stroke 0.91
               – avgPx ~320 px → stroke 1.09 */
            var stroke = 0.55 + (Math.log(Math.max(avgPx, 10) / 40) / Math.LN2) * 0.18;
            stroke = Math.max(0.45, Math.min(1.20, stroke));

            svg.style.setProperty('--map-stroke', stroke.toFixed(2));
            svg.style.setProperty('--map-stroke-hover', (stroke * 1.7).toFixed(2));
        });
    }

    /* Run on first paint + on resize (rendered widths change) */
    function scheduleTune(){
        if (document.readyState === 'complete') tuneMapStrokes();
        else window.addEventListener('load', tuneMapStrokes);
    }
    scheduleTune();
    var resizeT;
    window.addEventListener('resize', function(){
        clearTimeout(resizeT);
        resizeT = setTimeout(tuneMapStrokes, 200);
    });

    /* ─── Flag-on-hover (single image overlay) ─────────────────
       Replaces the SVG <pattern> fill approach (which renders the
       flag tiled OR fragmented across multi-subpath states) with a
       dynamic <image> overlay:

         • At rest, every region is filled neutral gray.
         • On mouseenter, the JS measures the path's bbox, creates
           a <clipPath> that mirrors the path's geometry, and inserts
           a single <image> element sized to exactly that bbox,
           clipped to the state's outline.
         • On mouseleave the image is removed.

       Result: exactly ONE flag per state at any moment, perfectly
       fitted to the state's shape — no tiling, no fragmentation. */
    var SVG_NS = 'http://www.w3.org/2000/svg';

    /* Build a flag URL for one region from its `data-name`.
       Uses Wikimedia Commons' Special:FilePath endpoint, which
       resolves "Flag of <Region>.svg" to the canonical hosted image
       and serves it with a redirect that browsers follow inside an
       SVG <image>. Falls back to the SVG's own country-flag URL on
       network error. */
    function buildStateFlagUrl(name){
        if (!name) return null;
        var slug = name.trim().replace(/\s+/g, '_');
        return 'https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_' +
               encodeURIComponent(slug) + '.svg';
    }

    function setupFlagHover(){
        var svgs = document.querySelectorAll('.w3-card svg');
        for (var s = 0; s < svgs.length; s++){
            var svg = svgs[s];
            if (svg._lgFlagSvg) continue;
            svg._lgFlagSvg = true;

            /* Read the fallback (country) flag URL from the
               existing <pattern> definition. */
            var patEl = svg.querySelector('pattern');
            var fallbackUrl = '';
            if (patEl){
                var imgEl = patEl.querySelector('image');
                if (imgEl){
                    fallbackUrl = imgEl.getAttribute('href') ||
                                  imgEl.getAttribute('xlink:href') || '';
                }
            }

            /* Make sure there's a <defs> we can attach clipPaths to */
            var defs = svg.querySelector('defs');
            if (!defs){
                defs = document.createElementNS(SVG_NS, 'defs');
                svg.insertBefore(defs, svg.firstChild);
            }

            /* Wire EVERY region path inside .w3-card svgs — every
               state shows its flag on hover, regardless of whether
               the source SVG shipped with a pattern fill or not. */
            var paths = svg.querySelectorAll('path[data-id], path[id]');
            for (var i = 0; i < paths.length; i++){
                var p = paths[i];
                if (p._lgFlagWired) continue;
                /* Skip the eagle loader (and other non-region paths
                   that happen to have an id). They live in SVGs
                   without a <pattern>; we can identify them either
                   by being in the eagle-loader SVG or by being inside
                   a <symbol>/<defs> rather than the map proper. */
                if (p.closest('defs, symbol, .eagle-loader__orbit')) continue;
                p._lgFlagWired = true;
                wirePath(p, svg, defs, fallbackUrl);
            }
        }
    }

    function wirePath(path, svg, defs, fallbackUrl){
        var overlayImg = null;
        var clipId = null;
        /* Resolve the per-region flag URL from data-name; if absent,
           use the country flag as the URL outright. */
        var regionName = path.getAttribute('data-name') ||
                         path.getAttribute('data-id') || '';
        var stateFlagUrl = buildStateFlagUrl(regionName) || fallbackUrl;

        path.addEventListener('mouseenter', function(){
            var bbox;
            try { bbox = path.getBBox(); } catch(e){ return; }
            if (!bbox || !bbox.width || !bbox.height) return;

            /* Build a one-off clipPath that mirrors this path's
               geometry (cached after first hover). The clipPath
               inner path also carries the SAME fill-rule as the
               source SVG (evenodd, per the inline style block in
               the SVG defs) — without this, complex multi-subpath
               states clip oddly and leave bare patches inside their
               borders instead of fully covering them with flag. */
            if (!clipId){
                clipId = 'lg-flagclip-' +
                         (path.id || Math.random().toString(36).slice(2, 9));
                var clipEl = document.createElementNS(SVG_NS, 'clipPath');
                clipEl.setAttribute('id', clipId);
                clipEl.setAttribute('clipPathUnits', 'userSpaceOnUse');
                var clipPath = document.createElementNS(SVG_NS, 'path');
                clipPath.setAttribute('d', path.getAttribute('d') || '');
                clipPath.setAttribute('clip-rule', 'evenodd');
                clipPath.setAttribute('fill-rule', 'evenodd');
                clipEl.appendChild(clipPath);
                defs.appendChild(clipEl);
            }

            /* Insert one <image> sized to the path's full bounding
               box and clipped to the path outline. The flag now
               FITS THE SHAPE of the state — fills the bbox with
               preserveAspectRatio="slice" (cropping excess), then
               the clip-path trims it to the state silhouette. */
            overlayImg = document.createElementNS(SVG_NS, 'image');
            overlayImg.setAttributeNS('http://www.w3.org/1999/xlink',
                                       'xlink:href', stateFlagUrl);
            overlayImg.setAttribute('href', stateFlagUrl);
            overlayImg.setAttribute('x', bbox.x);
            overlayImg.setAttribute('y', bbox.y);
            overlayImg.setAttribute('width', bbox.width);
            overlayImg.setAttribute('height', bbox.height);
            overlayImg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
            overlayImg.setAttribute('clip-path', 'url(#' + clipId + ')');
            overlayImg.style.pointerEvents = 'none';
            /* If the per-region flag fails to load, swap to the
               country flag as a fallback. */
            overlayImg.addEventListener('error', function(){
                if (fallbackUrl && stateFlagUrl !== fallbackUrl){
                    overlayImg.setAttributeNS('http://www.w3.org/1999/xlink',
                                               'xlink:href', fallbackUrl);
                    overlayImg.setAttribute('href', fallbackUrl);
                }
            }, { once: true });
            svg.appendChild(overlayImg);
        });

        path.addEventListener('mouseleave', function(){
            if (overlayImg && overlayImg.parentNode){
                overlayImg.parentNode.removeChild(overlayImg);
            }
            overlayImg = null;
        });
    }
    /* ─── Mark traveled regions as green ──────────────────────
       The Vue popup-button strip near the top of each region card
       lists every state/country the user has actually visited.
       Each `.pop-up-button` has a SIBLING `<div>` (NOT inside the
       button) holding the abbreviation. We collect those visited
       abbreviations and stamp `.lg-traveled` on matching SVG paths. */
    function tagTraveledRegions(){
        var visited = Object.create(null);
        var buttons = document.querySelectorAll('.pop-up-button');
        for (var b = 0; b < buttons.length; b++){
            /* Walk forward through siblings to find the abv text.
               This is safer than `parentElement.querySelector('div')`
               which might also return a div nested inside the button. */
            var sib = buttons[b].nextElementSibling;
            while (sib && sib.tagName !== 'DIV') sib = sib.nextElementSibling;
            if (!sib) continue;
            var abv = (sib.textContent || '').trim().toUpperCase();
            /* Vue interpolations like "{{ item.abv }}" can leave the
               raw text when v-cloak hasn't been processed yet — skip those. */
            if (!abv || abv.indexOf('{{') !== -1) continue;
            if (abv.length > 6) continue;
            visited[abv] = true;
        }

        /* If no visited abvs were found yet (Vue not mounted), don't
           touch any classes — leave the previous state intact rather
           than clearing everything to gray. */
        var hasAny = false;
        for (var k in visited){ hasAny = true; break; }
        if (!hasAny) return;

        var paths = document.querySelectorAll(
            '.w3-card svg path[data-id], .w3-card svg path[id]');
        for (var i = 0; i < paths.length; i++){
            var p = paths[i];
            var key = (p.getAttribute('data-id') ||
                       p.getAttribute('id') || '').toUpperCase();
            if (visited[key]) p.classList.add('lg-traveled');
            else              p.classList.remove('lg-traveled');
        }
    }

    /* setupFlagHover() and tagTraveledRegions() were experimental
       overlays that competed with js/map-enhancer.js. Disabled —
       map-enhancer is the source of truth for visited colouring and
       hover-flag rendering (it reads image.json for per-region photo
       counts and creates the pattern fills). */
})();
</script>

</body>

<script>
    // Get elements
    var popup = document.getElementById("slideshowPopup");
    var btn = document.getElementById("openSlideshow");
    var span = document.getElementsByClassName("content-close")[0];
    var slides = document.getElementsByClassName("content-slide");
    var prev = document.querySelector(".content-prev");
    var next = document.querySelector(".content-next");

    var slideIndex = 1;
    showSlides(slideIndex);

    // Open the popup
    btn.onclick = function() {
        popup.style.display = "block";
        showSlides(slideIndex = 1);
    }

    // Close the popup
    span.onclick = function() {
        popup.style.display = "none";
    }

    // Next/previous controls
    function plusSlides(n) {
        showSlides(slideIndex += n);
    }

    prev.onclick = function() {
        plusSlides(-1);
    }

    next.onclick = function() {
        plusSlides(1);
    }




    var slideIndex = 1;
    showSlides(slideIndex);

    function changeSlide(n) {
        showSlides(slideIndex += n);
    }

    function nextSlide() {
        changeSlide(1); // This will increment the slideIndex by 1 and show the next slide
    }

    function prevSlide() {
        changeSlide(-1); // Corrected to use changeSlide for decrement
    }

    function currentSlide(n) {
        showSlides(slideIndex = n); // Corrected to properly use the parameter 'n'
    }

    function showSlides(n) {
        var i;
        var slides = document.getElementsByClassName("content-slide");
        var dots = document.getElementsByClassName("content-dot");
        if (n > slides.length) {slideIndex = 1}
        if (n < 1) {slideIndex = slides.length}
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" content-active-dot", "");
        }
        slides[slideIndex-1].style.display = "block";
        dots[slideIndex-1].className += " content-active-dot";
    }

    // Optional: Resetting Auto navigation upon manual changes
    function resetSlideInterval() {
        clearInterval(slideInterval);
        slideInterval = setInterval(function() { changeSlide(1); }, 2000);
    }

    // Directly using pauseSlideShow and resumeSlideShow to control the slideshow
    var slideInterval = setInterval(function() { changeSlide(1); }, 2000); // Auto-change slides

    // Pause and Resume functions
    function pauseSlideShow() {
        clearInterval(slideInterval);
    }

    function resumeSlideShow() {
        resetSlideInterval(); // Calls reset to resume auto-navigation
    }


    // Close the popup when clicking outside of it
    window.onclick = function(event) {
        if (event.target === popup) {
            popup.style.display = "none";
        }
    }







</script>

<!-- ─── Fix Bootstrap tooltip arrows to render as triangles ───
     `.tooltip-arrow` is a 0×0 element whose visible "arrow" is
     formed by one CSS border edge colored while the other three
     edges stay transparent. Some site-wide rule is setting
     `currentColor` on these edges (probably inheriting black),
     which paints ALL four edges → the arrow renders as a small
     solid rectangle. Forcing the three "wrong-side" edges to
     transparent restores the triangular shape. The per-placement
     rules in d.css (lines 4188+) explicitly color the correct
     edge for each placement (top/bottom/left/right). -->
<style>
    .tooltip-arrow {
        border-color: transparent !important;
    }
    .tooltip.top .tooltip-arrow,
    .tooltip.top-left .tooltip-arrow,
    .tooltip.top-right .tooltip-arrow {
        border-top-color: #000 !important;
    }
    .tooltip.bottom .tooltip-arrow,
    .tooltip.bottom-left .tooltip-arrow,
    .tooltip.bottom-right .tooltip-arrow {
        border-bottom-color: #000 !important;
    }
    .tooltip.left .tooltip-arrow {
        border-left-color: #000 !important;
    }
    .tooltip.right .tooltip-arrow {
        border-right-color: #000 !important;

</style>

<!-- ──────────────────────────────────────────────────────────────
     Re-initialize Bootstrap tooltips after Vue mounts the
     `.pop-up-button` elements. js/random.js calls
     `$('[data-toggle="tooltip"]').tooltip()` once at document.ready,
     but Vue's v-for templates haven't rendered yet at that point —
     so the country selectors under the search bar AND the region
     selectors under each map SVG don't receive their tooltips.

     This block re-runs the initialization at intervals up to 4 s
     post-load, and again on every DOM mutation, so EVERY popup
     button (no matter when Vue inserts it) gets the same Bootstrap
     tooltip behaviour. Both sets — search-bar and under-SVG — end
     up with identical hoverable native tooltips.

     `.tooltip()` is idempotent in Bootstrap 3 — calling it on an
     already-initialized element no-ops. -->
<script>
(function(){
    function initTooltips(){
        if (typeof jQuery === 'undefined') return;
        try {
            jQuery('[data-toggle="tooltip"]').tooltip({
                container: 'body',
                trigger: 'hover focus'
            });
        } catch (e) { /* tooltip already initialized — ignore */ }
    }
    if (document.readyState === 'complete') initTooltips();
    else window.addEventListener('load', initTooltips);
    /* Catch Vue mount waves */
    setTimeout(initTooltips, 400);
    setTimeout(initTooltips, 1200);
    setTimeout(initTooltips, 2500);
    setTimeout(initTooltips, 4000);
    /* Catch any future v-for re-renders */
    if (typeof MutationObserver !== 'undefined'){
        var debounce = null;
        new MutationObserver(function(){
            clearTimeout(debounce);
            debounce = setTimeout(initTooltips, 150);
        }).observe(document.body, { childList: true, subtree: true });
    }
})();
</script>
